<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUXORA — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f2ea;font-family:Arial,sans-serif}header{padding:18px 7%;border-bottom:1px solid #292929;display:flex;justify-content:space-between}.logo{font-size:24px;font-weight:900;letter-spacing:4px}.logo span{color:#d9b45b}main{max-width:1200px;margin:35px auto;padding:0 20px}h1{font-size:34px}.login{max-width:400px;margin:80px auto;background:#111;border:1px solid #292929;border-radius:16px;padding:28px}.login input,.tools input,.tools select{width:100%;margin:8px 0;padding:11px;background:#111;color:#fff;border:1px solid #444;border-radius:8px}.login button,button{padding:11px 16px;background:#d9b45b;border:0;border-radius:8px;font-weight:700;cursor:pointer}.login button{width:100%}.msg{color:#d9b45b}.tools{display:flex;gap:10px;margin:20px 0}.tools input{max-width:350px}.tools select{width:auto}.table{overflow:auto;background:#111;border:1px solid #292929;border-radius:14px}table{width:100%;min-width:950px;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #292929;text-align:left;font-size:13px}th{color:#d9b45b}td select{background:#111;color:#fff;border:1px solid #444;border-radius:7px;padding:6px}
</style></head>
<body>
<header><div class="logo">LUX<span>O</span>RA</div><button id="logout" hidden>Déconnexion</button></header>
<div id="login" class="login"><h2>Administration</h2><p>Connectez-vous pour voir les commandes.</p>
<input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Mot de passe">
<button id="loginBtn">Se connecter</button><p id="msg" class="msg"></p></div>
<main id="app" hidden><h1>Commandes LUXORA</h1><div class="tools"><input id="search" placeholder="Rechercher nom ou téléphone"><select id="filter"><option value="">Tous les statuts</option><option>pending</option><option>confirmed</option><option>delivered</option><option>cancelled</option></select><button id="refresh">Actualiser</button></div>
<div class="table"><table><thead><tr><th>Date</th><th>Client</th><th>Téléphone</th><th>Adresse</th><th>Produits</th><th>Total</th><th>Statut</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient("https://bimttawmwzuzlbzgpbqo.supabase.co","sb_publishable_TTQQPHcHGI_a_47m3k_ujg_AN0MpqDA");
let orders=[];
const el=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
async function load(){
 const r=await db.from("orders").select("*").order("created_at",{ascending:false});
 if(r.error){el("rows").innerHTML="<tr><td colspan='7'>"+esc(r.error.message)+"</td></tr>";return;}
 orders=r.data||[];render();
}
function render(){
 const q=el("search").value.toLowerCase(),f=el("filter").value;
 const a=orders.filter(o=>(!f||o.status===f)&&((o.customer_name||"").toLowerCase().includes(q)||(o.phone||"").includes(q)));
 el("rows").innerHTML=a.map(o=>{
  const ps=Array.isArray(o.products)?o.products.map(x=>esc(x.name)+" × "+esc(x.quantity)).join("<br>"):esc(o.products);
  return "<tr><td>"+esc(new Date(o.created_at).toLocaleString("fr-FR"))+"</td><td>"+esc(o.customer_name)+"</td><td>"+esc(o.phone)+"</td><td>"+esc(o.address)+"</td><td>"+ps+"</td><td>"+Number(o.total).toFixed(2)+" TND</td><td><select onchange=\"statusChange('"+o.id+"',this.value)\"><option "+(o.status==="pending"?"selected":"")+">pending</option><option "+(o.status==="confirmed"?"selected":"")+">confirmed</option><option "+(o.status==="delivered"?"selected":"")+">delivered</option><option "+(o.status==="cancelled"?"selected":"")+">cancelled</option></select></td></tr>";
 }).join("")||"<tr><td colspan='7'>Aucune commande</td></tr>";
}
async function statusChange(id,status){const r=await db.from("orders").update({status}).eq("id",id);if(r.error)alert(r.error.message);else load();}
el("loginBtn").onclick=async()=>{const r=await db.auth.signInWithPassword({email:el("email").value,password:el("password").value});if(r.error)el("msg").textContent=r.error.message;else init();};
async function init(){el("login").hidden=true;el("app").hidden=false;el("logout").hidden=false;load();}
el("logout").onclick=async()=>{await db.auth.signOut();location.reload();};el("search").oninput=render;el("filter").onchange=render;el("refresh").onclick=load;
db.auth.getSession().then(r=>{if(r.data.session)init();});
</script></body></html>
